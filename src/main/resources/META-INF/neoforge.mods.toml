[[mods]]
modId="lingua_universalis"
version="0.0.1a"
displayName="Lingua Universalis"

# 模组图标（哨子的 16×16 像素原图最近邻放大到 128×128，保留像素风）
# 26.2 起 `logoFile` 已弃用，模组列表改用它自己的 `bannerFile`
bannerFile="icon.png"
# 方形图标：模组列表左侧条目的图标（26.2 用 iconFile，logoFile 已弃用）
iconFile="icon.png"
logoBlur=false

# 作者与协作署名（显示在模组详情里）
authors="Maple"
credits="DeepSeek"

description='''这是一个关于魔物娘的模组。'''

# Mixin 配置：让原版"苦力怕躲猫 / 幻翼怕猫"的判定也认猫系魔物娘（见 com.linguauniversalis.mixin）
displayURL="https://github.com/MapleBadd/Lingua_Universalis"
issueTrackerURL="https://github.com/MapleBadd/Lingua_Universalis/issues"

[[mixins]]
    config="lingua_universalis.mixins.json"
[[dependencies.lingua_universalis]]
    modId="neoforge"
    type="required"
    versionRange="[26.2.0.77,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.lingua_universalis]]
    modId="minecraft"
    type="required"
    versionRange="[26.2]"
    ordering="NONE"
    side="BOTH"

[[dependencies.lingua_universalis]]
    modId="geckolib"
    type="required"
    versionRange="[5.5.5,)"
    ordering="NONE"
    side="BOTH"

# JEI（配方查看）：**可选**前置，客户端装了才会加载我们的 JEI 插件
[[dependencies.lingua_universalis]]
    modId="jei"
    type="optional"
    versionRange="[30.0.0,)"
    ordering="AFTER"
    side="CLIENT"
