[[mods]]
modId="lingua_universalis"
version="0.1.0"
displayName="Lingua Universalis"
description='''
Lingua Universalis is a monster-girl raising mod themed around companions that
talk with you, not mere pets.

Species follow a custom taxonomy (regnum/phylum/classis/ordo/familia/sectio)
driven by data templates: affection, mood, satiety and synergy form the raising
state machine (wild/friendly/companion/vowed). Interactions, behaviors,
low-mood behavior and animations are modular and registered per species, so new
species need data plus assets instead of rewritten core logic.

Targets: Minecraft Java 26.2 + NeoForge. GeckoLib animation integration is
planned for a later phase.
'''

[[dependencies.lingua_universalis]]
    modId="neoforge"
    type="required"
    versionRange="[26.2.0.77,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.lingua_universalis]]
    modId="minecraft"
    type="required"
    versionRange="[26.2]"
    ordering="NONE"
    side="BOTH"

[[dependencies.lingua_universalis]]
    modId="geckolib"
    type="required"
    versionRange="[5.5.5,)"
    ordering="NONE"
    side="BOTH"
