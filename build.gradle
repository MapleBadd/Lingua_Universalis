plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// NeoForge 26.2 官方模板默认：Maven 依赖源为 maven.neoforged.net。
// 若你的网络无法访问该源（如国内直连被重置），可在 settings.gradle 的 pluginManagement 之外，
// 为本仓库配置可用的 neoforge maven 镜像（例如 Lss233 聚合镜像），详见 README.md 的"构建说明"。
neoForge {
    version = project.neo_version

    // Default run configurations.
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // 附加仓库统一在此声明。
    // GeckoLib 5.x 发布在 Modrinth Maven（group 固定为 maven.modrinth）。
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    // GeckoLib：模型/动画/骨骼渲染库。
    // 【必须用版本 id】Modrinth 上 5.5.5 同时存在 fabric/forge/neoforge 三个 jar，
    // 用版本号解析可能拿到 Fabric 那个（编译能过，但 NeoForge 运行期不是 mod → 依赖缺失）。
    // 版本 id 与版本号见 gradle.properties（geckolib_version_id / geckolib_version）。
    implementation "maven.modrinth:geckolib:${geckolib_version_id}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
